<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Stockwise{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='style.css') }}" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">▦ Stockwise</a>{% if session.get('user_id') %}<div class="text-white">{{ session.username }} <a class="btn btn-sm btn-outline-light ms-3" href="{{ url_for('logout') }}">Sign out</a></div>{% endif %}</nav><main class="container py-4">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
