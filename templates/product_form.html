{% extends 'base.html' %}{% block title %}Product · Stockwise{% endblock %}{% block content %}<a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Back to inventory</a><div class="card border-0 shadow-sm p-4 mt-3"><h1 class="h3">{{ 'Edit product' if product else 'Add product' }}</h1><p class="text-secondary">Product details and stock thresholds.</p><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Product name *</label><input class="form-control" name="name" maxlength="100" required value="{{ product.name if product else '' }}"></div><div class="col-md-6"><label class="form-label">SKU *</label><input class="form-control" name="sku" maxlength="30" required value="{{ product.sku if product else '' }}"></div><div class="col-md-6"><label class="form-label">Category *</label><input class="form-control" name="category" maxlength="60" required value="{{ product.category if product else '' }}"></div><div class="col-md-6"><label class="form-label">Supplier</label><input class="form-control" name="supplier" maxlength="100" value="{{ product.supplier if product else '' }}"></div><div class="col-md-4"><label class="form-label">Unit price (₹) *</label><input class="form-control" type="number" min="0" step="0.01" name="price" required value="{{ product.price if product else '' }}"></div><div class="col-md-4"><label class="form-label">Quantity *</label><input class="form-control" type="number" min="0" name="quantity" required value="{{ product.quantity if product else 0 }}"></div><div class="col-md-4"><label class="form-label">Low stock threshold</label><input class="form-control" type="number" min="0" name="reorder_level" value="{{ product.reorder_level if product else 5 }}"></div><div class="col-12"><button class="btn btn-primary">Save product</button> <a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a></div></form></div>{% endblock %}
